<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login Access — Happy Local Adventure ERP</title>
  <link rel="icon" type="image/png" href="{{ logo_data_uri or url_for('static', filename='logo.png') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}?v=4">
  <style>
    .auth-viewport {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      background:
        radial-gradient(1000px 600px at 50% 20%, rgba(242, 128, 31, 0.12), transparent 70%),
        radial-gradient(800px 500px at 50% 80%, rgba(12, 163, 135, 0.14), transparent 60%),
        var(--page);
    }
    .auth-card {
      width: 100%;
      max-width: 420px;
      background: linear-gradient(180deg, rgba(26, 30, 40, 0.85) 0%, rgba(16, 20, 28, 0.95) 100%);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid var(--border-strong);
      border-radius: 24px;
      padding: 36px 32px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(255, 255, 255, 0.05);
      text-align: center;
      animation: authCardIn 0.35s cubic-bezier(0.16, 1, 0.3, 1);
    }
    @keyframes authCardIn {
      from { opacity: 0; transform: translateY(16px) scale(0.98); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    .auth-logo {
      width: 72px;
      height: 72px;
      margin: 0 auto 16px;
      border-radius: 20px;
      background: var(--surface-2);
      padding: 8px;
      border: 1px solid var(--border-strong);
      box-shadow: 0 8px 24px rgba(242, 128, 31, 0.15);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .auth-logo img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
    .auth-title {
      font-size: 1.4rem;
      font-weight: 800;
      color: var(--ink);
      margin: 0 0 6px;
      letter-spacing: -0.02em;
    }
    .auth-subtitle {
      font-size: 0.85rem;
      color: var(--ink-muted);
      margin: 0 0 28px;
    }
    .pwd-wrapper {
      position: relative;
      margin-bottom: 20px;
      text-align: left;
    }
    .pwd-input {
      width: 100%;
      padding: 14px 46px 14px 16px;
      background: var(--surface-2);
      border: 1.5px solid var(--border);
      border-radius: 12px;
      color: var(--ink);
      font-size: 1rem;
      font-family: inherit;
      outline: none;
      transition: all 0.2s ease;
    }
    .pwd-input:focus {
      border-color: var(--accent);
      background: var(--surface);
      box-shadow: 0 0 0 4px rgba(242, 128, 31, 0.15);
    }
    .pwd-toggle-btn {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      background: transparent;
      border: none;
      color: var(--ink-muted);
      cursor: pointer;
      padding: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 6px;
      transition: color 0.15s ease;
    }
    .pwd-toggle-btn:hover {
      color: var(--ink);
    }
    .auth-submit-btn {
      width: 100%;
      padding: 14px 20px;
      background: linear-gradient(135deg, var(--accent) 0%, var(--accent-2) 100%);
      color: #ffffff;
      border: none;
      border-radius: 12px;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 6px 20px rgba(242, 128, 31, 0.35);
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .auth-submit-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 8px 24px rgba(242, 128, 31, 0.45);
      filter: brightness(1.05);
    }
    .auth-submit-btn:active {
      transform: translateY(0);
    }
    .auth-error {
      background: rgba(239, 68, 68, 0.12);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: #f87171;
      padding: 10px 14px;
      border-radius: 10px;
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 8px;
      text-align: left;
      animation: shake 0.3s ease-in-out;
    }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-4px); }
      40%, 80% { transform: translateX(4px); }
    }
    .auth-footer {
      margin-top: 24px;
      padding-top: 20px;
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.75rem;
      color: var(--ink-muted);
    }
    .auth-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: rgba(12, 163, 135, 0.12);
      color: #34d399;
      padding: 4px 8px;
      border-radius: 999px;
      font-weight: 600;
    }
    @media (max-width: 480px) {
      .auth-card {
        padding: 28px 20px;
        border-radius: 20px;
      }
      .auth-title { font-size: 1.25rem; }
    }
  </style>
</head>
<body>
  <div class="auth-viewport">
    <div class="auth-card">
      <div class="auth-logo">
        <img src="{{ logo_data_uri or url_for('static', filename='logo.png') }}" alt="Logo">
      </div>
      
      <h1 class="auth-title">Happy Local ERP</h1>
      <p class="auth-subtitle">Tour Operator Management System</p>

      {% if error %}
        <div class="auth-error">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
          <span>{{ error }}</span>
        </div>
      {% endif %}

      <form method="POST" autocomplete="off">
        <div class="pwd-wrapper">
          <input 
            type="password" 
            name="password" 
            id="login-password" 
            class="pwd-input" 
            placeholder="Enter access password..." 
            required 
            autofocus
          >
          <button type="button" class="pwd-toggle-btn" onclick="togglePasswordVisibility()" title="Show / Hide Password">
            <svg id="eye-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
            </svg>
          </button>
        </div>

        <button type="submit" class="auth-submit-btn">
          <span>Sign In to System</span>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
        </button>
      </form>

      <div class="auth-footer">
        <span class="auth-badge">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
          Protected System
        </span>
        <span>Bali, Indonesia &bull; 2026</span>
      </div>
    </div>
  </div>

  <script>
    function togglePasswordVisibility() {
      const input = document.getElementById('login-password');
      const icon = document.getElementById('eye-icon');
      if (input.type === 'password') {
        input.type = 'text';
        icon.innerHTML = '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>';
      } else {
        input.type = 'password';
        icon.innerHTML = '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>';
      }
    }
  </script>
</body>
</html>
